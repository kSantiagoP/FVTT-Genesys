name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - name: Install dependencies
        run: |
          # foundry-vtt-types depende de repo privado (@pixi/basis via SSH) —
          # não acessível no CI. Só é necessário pra typecheck local.
          jq 'del(.devDependencies["@league-of-foundry-developers/foundry-vtt-types"])' package.json > package.json.tmp
          mv package.json.tmp package.json
          yarn install

      - name: Build
        run: yarn release

      - name: Get version
        id: version
        run: echo "version=$(node build/version.js)" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create release-${{ steps.version.outputs.version }} \
            --title "${{ steps.version.outputs.version }}" \
            --notes "$(sed -n '/^## /{p; :a; n; /^## /q; p; ba}' CHANGELOG.md | head -n -1)" \
            ./genesys-${{ steps.version.outputs.version }}.zip \
            ./dist/system.json#manifest.json
